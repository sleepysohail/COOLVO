<style>
:root{--bg:#f6f3ef;--card:#fff;--ink:#1d1814;--mut:#6f655c;--line:#e3dcd4;--ac:#e8541e;--acink:#fff;--ok:#1d7a46;--warn:#a65b00;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120f;--card:#231b16;--ink:#f3ece5;--mut:#a89c91;--line:#3a2f27;--ok:#4cc582;--warn:#f0a53c;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120f;--card:#231b16;--ink:#f3ece5;--mut:#a89c91;--line:#3a2f27;--ok:#4cc582;--warn:#f0a53c;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 14px 90px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.6em 0 .2em}
h2{font-size:1.25rem}h3{font-size:1.05rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0}
.brand{font-family:Georgia,serif;font-size:1.4rem;font-weight:700;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:64px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
button.p{background:var(--ac);color:var(--acink);border-color:var(--ac);font-weight:600}
button.s{min-height:36px;padding:6px 10px;font-size:.9rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:.78rem;min-height:52px;color:var(--mut);padding:6px 2px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.tag{font-size:.78rem;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.w{color:var(--warn);border-color:var(--warn)}.tag.b{color:var(--bad);border-color:var(--bad)}
.mut{color:var(--mut);font-size:.9rem}
.safe{border-left:4px solid var(--bad);padding-left:10px;color:var(--bad);font-size:.9rem;margin:10px 0}
table{width:100%;border-collapse:collapse}td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.big{font-family:Georgia,serif;font-size:1.7rem;line-height:1.1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g4 .card{padding:8px;margin:6px 0;text-align:center}.g4 .big{font-size:1.4rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{flex:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}.dw{position:fixed;top:0;right:0;bottom:0;width:min(300px,85vw);background:var(--card);padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:21;border-left:1px solid var(--line)}.dw button.it{display:block;width:100%;text-align:left;margin:6px 0}.av{overflow:hidden;width:40px;height:40px;border-radius:50%;background:var(--ac);color:var(--acink);font-weight:700;padding:0;border:0}
.note{font-size:.82rem;color:var(--mut);margin-top:16px}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="dr" style="display:none"></div>

["LG","CH38","Outdoor unit current protection / compressor overload.","AC band karein, power supply aur compressor wiring check karein.","DigiRake"],
["Daikin","U4","Indoor aur outdoor unit ke beech transmission/communication error.","Inter-unit wiring aur connection check karein, breaker se reset karein.","Daikin error code guide, Bajaj Finserv"],

var S={user:ld("c2u",null),tab:"",edit:null,q:"",brand:"All",jq:"",
 jobs:ld("c2j",[]),inv:ld("c2i",[]),leads:ld("c2l",[]),stock:ld("c2s",[]),dep:ld("c2d",[]),msgs:ld("c2m",[]),room:"all",pics:ld("c2p",{})};
function save(){sv("c2p",S.pics);sv("c2m",S.msgs);sv("c2r",RATES);sv("c2x",EXTRA);sv("c2d",S.dep);sv("c2j",S.jobs);sv("c2i",S.inv);sv("c2l",S.leads);sv("c2s",S.stock)}
function iso(n){return new Date(Date.now()-n*864e5).toISOString()}
function dt(i){return new Date(i).toLocaleDateString("en-IN")}
function inP(i,p){var d=new Date(i),n=new Date();if(p==="d")return d.toDateString()===n.toDateString();if(p==="w")return d<=n&&n-d<7*864e5;if(p==="m")return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();return d.getFullYear()===n.getFullYear()}
function nid(p,l){return p+String(l.length+1).padStart(4,"0")}
function login(i){S.user=USERS[i];sv("c2u",S.user);S.tab=tabs()[0][0];render()}
function logout(){openD(false);S.user=null;sv("c2u",null);render()}
function go(t){openD(false);S.tab=t;S.edit=null;render()}
function tabs(){return S.user.role==="tech"?[["my","My jobs"],["new","New job"],["rate","Rate list"],["code","Error codes"],["chat","Chat"]]:[["home","Home"],["leads","Leads"],["jobs","Jobs"],["stock","Stock"],["team","Team"],["bills","Bills"],["chat","Chat"]].concat(S.user.role==="owner"?[["rate","Rates"]]:[])}
function G(i){return document.getElementById(i).value.trim()}
function addLead(){
 var ph=G("l_ph").replace(/\D/g,"").slice(-10);if(!G("l_name")||ph.length!==10){alert("Name and a 10-digit mobile number are required.");return}
 S.leads.push({id:nid("LD-",S.leads),name:G("l_name"),ph:ph,src:G("l_src"),app:G("l_app"),addr:G("l_addr"),prob:G("l_prob"),at:new Date().toISOString(),job:null,w:!!warr(ph)});save();if(S.leads[S.leads.length-1].w)alert("Note: this customer has an invoiced job within the last 30 days. This may be a warranty claim.");render()}
function assign(lid,tid){
 if(!tid)return;var l=S.leads.find(function(x){return x.id===lid}),t=USERS.find(function(u){return u.id===tid});
 var j={id:nid("JOB-",S.jobs),lead:lid,tid:t.id,tname:t.name,name:l.name,ph:l.ph,addr:l.addr,app:l.app,brand:"",problem:l.prob,work:"",parts:"",pid:"",pq:0,svc:"",charge:0,collected:0,status:"assigned",at:new Date().toISOString()};
 S.jobs.push(j);l.job=j.id;save();render()}
function saveJob(){
 var ph=G("f_ph").replace(/\D/g,"").slice(-10);
 if(!G("f_name")||ph.length!==10||!G("f_addr")){alert("Name, 10-digit mobile and address are required.");return}
 var f={name:G("f_name"),ph:ph,addr:G("f_addr"),app:G("f_app"),brand:G("f_brand"),problem:G("f_prob"),work:G("f_work"),parts:G("f_parts"),pid:G("f_pid"),pq:+G("f_pq")||0,svc:G("f_svc"),charge:+G("f_amt")||0,collected:+G("f_col")||0,status:"submitted",done:new Date().toISOString()};
 var dup=S.jobs.filter(function(j){return j.ph===ph&&j.id!==S.edit}).length;
 if(S.edit){var j=S.jobs.find(function(x){return x.id===S.edit});for(var k in f)j[k]=f[k]}
 else{f.id=nid("JOB-",S.jobs);f.tid=S.user.id;f.tname=S.user.name;f.at=f.done;S.jobs.push(f)}
 S.edit=null;save();go("my");
 if(dup)setTimeout(function(){alert("Note: this mobile number already has "+dup+" earlier job(s). Check for warranty or a repeat visit.")},50)}
function jobSt(id,st){var j=S.jobs.find(function(x){return x.id===id});j.status=st;
 if(st==="approved"&&j.pid&&j.pq&&!j.used){var p=S.stock.find(function(s){return s.id===j.pid});if(p){p.qty=Math.max(0,p.qty-j.pq);j.used=true}}
 save();render()}
function mkInvoice(id){
 var j=S.jobs.find(function(x){return x.id===id});var pay=prompt("Payment received from the customer? (Rs)",j.collected);if(pay===null)return;
 j.status="invoiced";j.collected=+pay||0;
 S.inv.push({n:nid("INV-",S.inv),job:j.id,name:j.name,total:j.charge,paid:j.collected,svc:j.svc,at:new Date().toISOString()});save();render()}
function addPart(){if(!G("s_name")){alert("Enter the part name.");return}
 S.stock.push({id:nid("P-",S.stock),name:G("s_name"),qty:+G("s_qty")||0,cost:+G("s_cost")||0,price:+G("s_price")||0,low:+G("s_low")||2});save();render()}

function seed(){S.dep=[];

 S.leads=L.map(function(a,i){return{id:nid("LD-",new Array(i)),name:a[0],ph:a[1],src:a[2],app:a[3],addr:a[4],prob:a[5],at:iso(a[6]),job:null}});
 S.stock=[{id:"P-0001",name:"AC filter",qty:12,cost:80,price:150,low:5},{id:"P-0002",name:"Washing machine drain pipe",qty:2,cost:120,price:220,low:3},{id:"P-0003",name:"Copper pipe (m)",qty:30,cost:600,price:750,low:10}];
 S.jobs=[];S.inv=[];
 [[0,"CLV-T001","Split AC jet / normal service",550,550,"invoiced"],[1,"CLV-T002","Split AC installation (labour)",1499,1000,"invoiced"],[2,"CLV-T001","Repair / other",450,450,"submitted"],[3,"CLV-T002","",0,0,"assigned"],[4,"CLV-T001","Split AC foam service",750,750,"approved"]].forEach(function(r){
  var l=S.leads[r[0]],t=USERS.find(function(u){return u.id===r[1]});
  var j={id:nid("JOB-",S.jobs),lead:l.id,tid:t.id,tname:t.name,name:l.name,ph:l.ph,addr:l.addr,app:l.app,brand:"",problem:l.prob,work:r[5]==="assigned"?"":"Work completed",parts:"",pid:"",pq:0,svc:r[2],charge:r[3],collected:r[4],status:r[5],at:l.at};
  S.jobs.push(j);l.job=j.id;
  if(r[5]==="invoiced")S.inv.push({n:nid("INV-",S.inv),job:j.id,name:j.name,total:j.charge,paid:j.collected,svc:j.svc,at:j.at})});

function clearAll(){if(confirm("Delete all data?")){S.leads=[];S.jobs=[];S.inv=[];S.stock=[];S.dep=[];S.msgs=[];save();render()}}
var AREAS=["Pilibhit","Puranpur","Shahjahanpur","Majhola","Amariya","Bisalpur","Kalinagar"];
function areaOf(a){a=(a||"").toLowerCase();var m=AREAS.filter(function(x){return a.indexOf(x.toLowerCase())>-1||(x==="Amariya"&&a.indexOf("amaria")>-1)});return m.length?m[0]:"Other"}

 S.leads=d(3).map(function(x){return{id:x.ref,uid:x.id,name:x.name,ph:x.phone,src:x.source,app:x.appliance||"",addr:x.address||"",prob:x.problem||"",w:x.warranty_flag,at:x.created_at,job:jol[x.ref]||null}});
 S.inv=d(5).map(function(x){return{n:x.number,job:jref[x.job_id]||"",name:x.customer_name,total:+x.total,paid:+x.paid,svc:x.service||"",at:x.created_at}});
 S.dep=d(8).map(function(x){return{tid:x.partner_code,amt:+x.amount,at:x.created_at}});
 S.msgs=d(9).map(function(x){return{from:x.sender_code,name:nm[x.sender_code]||x.sender_code,to:x.to_code||"all",text:x.body,at:x.created_at}});
}
async function after(){
 if(!S.session){S.user=null;return}
 await loadAll();
 var em=(S.session.user.email||"").toLowerCase();
 var me=STAFF.find(function(x){return x.email===em&&x.active});
 S.user=me?USERS.find(function(u){return u.id===me.code}):null;
 if(S.user){S.user.email=me.email;listen()}
}
function listen(){if(chanOn)return;chanOn=true;sb.channel("msgs").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},function(){if(S.user)loadAll().then(soft).catch(function(){})}).subscribe()}
async function done(){await loadAll();render()}
function soft(){
 var t=S.tab,e=document.activeElement;
 if(t==="chat"){var i=document.getElementById("c_t");if(i&&i.value)return;render();var j=document.getElementById("c_t");if(j&&e&&e.id==="c_t")j.focus();return}
 if(e&&/INPUT|TEXTAREA|SELECT/.test(e.tagName))return;
 if(["home","jobs","team","bills","my"].indexOf(t)>-1)render()}
setInterval(function(){if(S.user&&!document.hidden)loadAll().then(soft).catch(function(){})},15000);
function gLogin(){sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})}
function gOut(){S.session=null;S.user=null;sb.auth.signOut().then(render)}
function logout(){openD(false);gOut()}
function gate(){
 var a=document.getElementById("app");document.getElementById("nav").innerHTML="";
 var h='<div class="top"><span class="brand">COOLVO</span></div>';
 if(S.err)h+='<div class="safe">'+esc(S.err)+'</div>';
 else if(!S.ready)h+='<p class="mut">Loading…</p>';
 else if(!S.session)h+='<h2>Sign in</h2><p class="mut">Use the Google account the owner added for you.</p><button class="p" style="width:100%" onclick="gLogin()">Continue with Google</button>';
 else h+='<h2>Access not set up</h2><p class="mut">'+esc(S.session.user.email||"")+' is not on the Coolvo staff list. Ask the owner to add this email.</p><button onclick="gOut()">Sign out</button>';
 a.innerHTML=h}
var _tabs=tabs;tabs=function(){var t=_tabs();if(S.user.role==="owner")t=t.concat([["staff","Staff"]]);return t};
/* writes */
async function addLead(){
 var ph=G("l_ph").replace(/\D/g,"").slice(-10);if(!G("l_name")||ph.length!==10){alert("Name and a 10-digit mobile number are required.");return}
 var w=!!warr(ph);
 await W(sb.from("leads").insert({name:G("l_name"),phone:ph,source:G("l_src"),appliance:G("l_app"),address:G("l_addr"),problem:G("l_prob"),warranty_flag:w,created_by:S.user.email}));
 if(w)alert("Note: this customer has an invoiced job within the last 30 days. This may be a warranty claim.");
 await done()}
async function assign(lid,tid){if(!tid)return;var l=S.leads.find(function(x){return x.id===lid});
 await W(sb.from("jobs").insert({lead_id:l.uid,partner_code:tid,customer_name:l.name,phone:l.ph,address:l.addr,appliance:l.app,problem:l.prob,status:"assigned"}));await done()}
async function saveJob(){
 var ph=G("f_ph").replace(/\D/g,"").slice(-10);
 if(!G("f_name")||ph.length!==10||!G("f_addr")){alert("Name, 10-digit mobile and address are required.");return}
 var f={customer_name:G("f_name"),phone:ph,address:G("f_addr"),appliance:G("f_app"),brand:G("f_brand"),problem:G("f_prob"),work_done:G("f_work"),parts_text:G("f_parts"),part_id:G("f_pid")||null,part_qty:+G("f_pq")||0,service:G("f_svc"),charge:+G("f_amt")||0,collected:+G("f_col")||0,status:"submitted"};
 var dup=S.jobs.filter(function(j){return j.ph===ph&&j.id!==S.edit}).length;
 if(S.edit)await W(sb.from("jobs").update(f).eq("ref",S.edit));
 else{f.partner_code=S.user.id;await W(sb.from("jobs").insert(f))}
 S.edit=null;await loadAll();go("my");
 if(dup)setTimeout(function(){alert("Note: this mobile number already has "+dup+" earlier job(s). Check for warranty or a repeat visit.")},50)}
async function jobSt(id,st){await W(sb.from("jobs").update({status:st}).eq("ref",id));await done()}
async function mkInvoice(id){
 var j=S.jobs.find(function(x){return x.id===id});if(!j||j.status!=="approved")return;
 var pay=prompt("Payment received from the customer? (Rs)",j.collected);if(pay===null)return;
 await W(sb.from("invoices").insert({job_id:j.uid,customer_name:j.name,service:j.svc,total:j.charge,paid:+pay||0,created_by:S.user.email}));
 await W(sb.from("jobs").update({status:"invoiced",collected:+pay||0}).eq("ref",id));await done()}
async function addPart(){
 if(!G("s_name")){alert("Enter the part name.");return}
 var r=await W(sb.from("stock").insert({name:G("s_name"),qty:+G("s_qty")||0,low_alert:+G("s_low")||2,price:+G("s_price")||0}).select());
 await W(sb.from("stock_cost").insert({stock_id:r[0].id,cost:+G("s_cost")||0}));await done()}
async function stockAdd(id){var n=prompt("Quantity to add?");if(n===null)return;var p=S.stock.find(function(s){return s.id===id});
 await W(sb.from("stock").update({qty:p.qty+(+n||0)}).eq("id",id));await done()}
async function deposit(tid){var n=prompt("Amount deposited to the company? (Rs)");if(n===null||!(+n>0))return;
 await W(sb.from("deposits").insert({partner_code:tid,amount:+n,recorded_by:S.user.email}));await done()}
async function rEdit(i,k,v){if(S.user.role!=="owner")return;var r=RATES[i],o=k?{price:+v||0}:{name:(v.trim()||r[0])};
 await W(sb.from("rates").update(o).eq("id",r[2]));await done()}
async function rDel(i){if(S.user.role!=="owner")return;if(confirm("Remove this item?")){await W(sb.from("rates").delete().eq("id",RATES[i][2]));await done()}}
async function rAdd(){if(S.user.role!=="owner")return;if(!G("r_n")){alert("Enter the item name.");return}
 await W(sb.from("rates").insert({name:G("r_n"),price:+G("r_p")||0,sort:RATES.length+1}));await done()}
async function saveExtra(v){if(S.user.role!=="owner")return;EXTRA=v;await W(sb.from("settings").upsert({key:"rate_details",value:v}))}
async function sendMsg(){var t=G("c_t");if(!t)return;
 await W(sb.from("messages").insert({sender_code:S.user.id,to_code:S.room==="all"?null:S.room,body:t}));await loadAll();render();var i=document.getElementById("c_t");if(i)i.focus()}
function setPic(el){var f=el.files&&el.files[0];if(!f)return;if(!/^image\//.test(f.type)){alert("Please choose an image file.");return}
 var r=new FileReader();r.onload=function(){var im=new Image();im.onload=async function(){var c=document.createElement("canvas"),z=200,m=Math.min(im.width,im.height),cx=c.getContext("2d");c.width=c.height=z;cx.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);
 await W(sb.rpc("set_my_avatar",{p:c.toDataURL("image/jpeg",.8)}));await done();openD(true)};im.onerror=function(){alert("Could not read this image.")};im.src=r.result};r.readAsDataURL(f)}
async function rmPic(){await W(sb.rpc("set_my_avatar",{p:""}));await done();openD(true)}
async function addStaff(){
 var n=G("st_n"),e=G("st_e").toLowerCase();if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){alert("Enter a name and a valid Google email.");return}
 var mx=0;STAFF.forEach(function(x){var m=/^CLV-T(\d+)$/.exec(x.code);if(m)mx=Math.max(mx,+m[1])});
 await W(sb.from("staff").insert({email:e,name:n,role:"partner",code:"CLV-T"+String(mx+1).padStart(3,"0")}));await done()}
async function setActive(code,a){if(!confirm(a?"Activate this person?":"Deactivate this person? They will not be able to log in."))return;
 await W(sb.from("staff").update({active:a}).eq("code",code));await done()}
function vStaff(){
 return'<h2>Staff</h2><div class="card"><b>Add Coolvo Partner</b><label>Name</label><input id="st_n"><label>Google email</label><input id="st_e" inputmode="email" autocapitalize="none"><p><button class="p s" onclick="addStaff()">Add partner</button></p><div class="mut">They can sign in only with this Google email.</div></div><div class="card"><table>'+STAFF.map(function(x){return"<tr><td>"+avS(x.code,x.name,28)+esc(x.name)+'<br><span class="mut">'+esc(x.email)+" · "+x.code+"</span></td><td>"+(x.role==="owner"?"":(x.active?'<button class="s" onclick="setActive(\''+x.code+'\',false)">Deactivate</button>':'<button class="s" onclick="setActive(\''+x.code+'\',true)">Activate</button>'))+"</td></tr>"}).join("")+"</table></div>"}
async function init(){
 try{var r=await sb.auth.getSession();S.session=r.data.session;await after();S.ready=true}
 catch(e){S.ready=true;S.err="Could not connect to the server. Check your internet connection."}
 render();
 sb.auth.onAuthStateChange(function(ev,s){var had=!!S.session;S.session=s;
  if((ev==="SIGNED_IN"&&!had)||ev==="SIGNED_OUT"){after().then(render).catch(function(){render()})}});
}
init();
